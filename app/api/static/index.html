<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carbon Tatva — Energy Efficiency Copilot</title>
  <meta name="description" content="AI-powered copilot for BEE Energy Efficiency guides on Electrical and Thermal Utilities." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --font: 'Raleway', sans-serif;

      /* Dark mode (default) */
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-sidebar: #080808;
      --bg-input: #161616;
      --bg-hover: #1a1a1a;
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 200, 83, 0.5);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-muted: #606060;
      --accent: #00c853;
      --accent-hover: #00e676;
      --accent-bg: rgba(0, 200, 83, 0.10);
      --user-msg-bg: #0d1a0d;
      --user-msg-border: rgba(0, 200, 83, 0.25);
      --bot-msg-bg: #111111;
      --bot-msg-border: rgba(255, 255, 255, 0.06);
      --shadow: 0 4px 24px rgba(0,0,0,0.5);
      --scrollbar-thumb: #2a2a2a;
    }

    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-sidebar: #eeeeee;
      --bg-input: #f0f0f0;
      --bg-hover: #e0e0e0;
      --border: rgba(0, 0, 0, 0.08);
      --border-active: rgba(0, 150, 60, 0.4);
      --text-primary: #111111;
      --text-secondary: #444444;
      --text-muted: #888888;
      --accent: #00963a;
      --accent-hover: #00b344;
      --accent-bg: rgba(0, 150, 58, 0.08);
      --user-msg-bg: #e8f5e9;
      --user-msg-border: rgba(0, 150, 58, 0.2);
      --bot-msg-bg: #ffffff;
      --bot-msg-border: rgba(0, 0, 0, 0.06);
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --scrollbar-thumb: #c0c0c0;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      transition: background 0.3s, color 0.3s;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: background 0.3s, border 0.3s;
    }

    .sidebar-header {
      padding: 16px 18px;
    }

    .new-chat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .new-chat-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-active);
    }
    .new-chat-btn svg {
      flex-shrink: 0;
    }

    .sidebar-section-title {
      padding: 20px 18px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .history-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .history-item.active {
      background: var(--accent-bg);
      color: var(--accent);
      font-weight: 600;
    }
    .history-item svg {
      flex-shrink: 0;
      opacity: 0.6;
    }
    .history-item.active svg {
      opacity: 1;
    }

    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-footer .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .sidebar-footer .status-dot.ready {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(0, 200, 83, 0.4);
    }
    .sidebar-footer .status-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ===== MAIN AREA ===== */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      transition: background 0.3s, border 0.3s;
      min-height: 56px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
    }
    .sidebar-toggle:hover { color: var(--text-primary); }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #005f27);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo .logo-icon svg {
      color: #fff;
    }
    .brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand-name span {
      color: var(--accent);
    }
    .copilot-badge {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--accent-bg);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 200, 83, 0.2);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .theme-toggle:hover {
      color: var(--text-primary);
      border-color: var(--border-active);
      background: var(--bg-hover);
    }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="light"] .theme-toggle .icon-moon { display: none; }
    [data-theme="light"] .theme-toggle .icon-sun { display: block; }

    /* ===== CHAT LOG ===== */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      gap: 14px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      animation: msgIn 0.35s ease;
    }
    .msg-row.user {
      flex-direction: row-reverse;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 4px;
    }
    .msg-row.bot .msg-avatar {
      background: linear-gradient(135deg, var(--accent), #005f27);
      color: #fff;
    }
    .msg-row.user .msg-avatar {
      background: var(--bg-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .msg-content {
      flex: 1;
      min-width: 0;
    }

    .msg-bubble {
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.7;
      word-break: break-word;
    }
    .msg-row.user .msg-bubble {
      white-space: pre-wrap;
    }
    .msg-row.bot .msg-bubble {
      background: var(--bot-msg-bg);
      border: 1px solid var(--bot-msg-border);
      border-top-left-radius: 3px;
    }
    .msg-row.user .msg-bubble {
      background: var(--user-msg-bg);
      border: 1px solid var(--user-msg-border);
      border-top-right-radius: 3px;
      color: var(--text-primary);
    }
    .msg-row.error .msg-bubble {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    /* ===== MARKDOWN RENDERED CONTENT ===== */
    .msg-row.bot .msg-bubble h1,
    .msg-row.bot .msg-bubble h2,
    .msg-row.bot .msg-bubble h3,
    .msg-row.bot .msg-bubble h4 {
      font-family: var(--font);
      color: var(--text-primary);
      margin-top: 1.2em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }
    .msg-row.bot .msg-bubble h1:first-child,
    .msg-row.bot .msg-bubble h2:first-child,
    .msg-row.bot .msg-bubble h3:first-child {
      margin-top: 0;
    }
    .msg-row.bot .msg-bubble h1 { font-size: 1.25rem; font-weight: 700; }
    .msg-row.bot .msg-bubble h2 { font-size: 1.1rem; font-weight: 700; }
    .msg-row.bot .msg-bubble h3 { font-size: 1rem; font-weight: 600; }
    .msg-row.bot .msg-bubble h4 { font-size: 0.95rem; font-weight: 600; }

    .msg-row.bot .msg-bubble p {
      margin-bottom: 0.75em;
    }
    .msg-row.bot .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .msg-row.bot .msg-bubble ul,
    .msg-row.bot .msg-bubble ol {
      padding-left: 1.5em;
      margin-bottom: 0.75em;
    }
    .msg-row.bot .msg-bubble li {
      margin-bottom: 0.35em;
    }
    .msg-row.bot .msg-bubble li:last-child {
      margin-bottom: 0;
    }

    .msg-row.bot .msg-bubble strong {
      font-weight: 700;
      color: var(--text-primary);
    }

    .msg-row.bot .msg-bubble em {
      font-style: italic;
    }

    .msg-row.bot .msg-bubble code {
      font-family: 'Consolas', 'Monaco', monospace;
      background: var(--bg-hover);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85em;
    }

    .msg-row.bot .msg-bubble pre {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 0.75em 0;
    }
    .msg-row.bot .msg-bubble pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
    }

    .msg-row.bot .msg-bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 0.75em 0;
      color: var(--text-secondary);
    }

    .msg-row.bot .msg-bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75em 0;
      font-size: 0.88em;
    }
    .msg-row.bot .msg-bubble th,
    .msg-row.bot .msg-bubble td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .msg-row.bot .msg-bubble th {
      background: var(--bg-hover);
      font-weight: 600;
    }

    /* Inline citation badges in answer text */
    .inline-citation {
      display: inline;
      font-size: 0.72em;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-bg);
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid rgba(0, 200, 83, 0.2);
      vertical-align: super;
      line-height: 1;
      white-space: nowrap;
    }

    /* Retrieval pipeline indicator */
    .retrieval-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      margin-bottom: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-bg);
      border: 1px solid rgba(0, 200, 83, 0.2);
      border-radius: 6px;
    }
    .retrieval-tag svg { flex-shrink: 0; }

    /* Citations box */
    .citations-box {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .citations-box .cite-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .citation-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid rgba(0, 200, 83, 0.2);
      cursor: default;
      position: relative;
      transition: all 0.2s;
    }
    .citation-tag:hover {
      background: rgba(0, 200, 83, 0.2);
    }
    .citation-tag .ct-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 400;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
      box-shadow: var(--shadow);
      transform: translateX(-50%) translateY(4px);
    }
    .citation-tag .ct-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--border);
    }
    .citation-tag:hover .ct-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 20px;
      background: var(--bot-msg-bg);
      border: 1px solid var(--bot-msg-border);
      border-radius: 12px;
      border-top-left-radius: 3px;
    }
    .typing-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-right: 8px;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    .typing-dot:nth-child(3) { animation-delay: 0s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1.0); opacity: 1; }
    }

    /* ===== WELCOME SCREEN ===== */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .welcome-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #005f27);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 200, 83, 0.15);
    }
    .welcome-icon svg { color: #fff; }
    .welcome-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .welcome-title span { color: var(--accent); }
    .welcome-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .welcome-prompts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 600px;
      width: 100%;
    }
    .prompt-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font);
    }
    .prompt-card:hover {
      border-color: var(--border-active);
      background: var(--bg-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .prompt-card .prompt-icon {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .prompt-card .prompt-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
      font-weight: 400;
    }
    .prompt-card:hover .prompt-text {
      color: var(--text-primary);
    }

    /* ===== INPUT BAR ===== */
    .input-bar {
      padding: 16px 24px 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      transition: background 0.3s, border 0.3s;
    }

    .input-row {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 8px 6px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.1);
    }

    .input-row textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 0.9rem;
      resize: none;
      min-height: 40px;
      max-height: 160px;
      line-height: 1.5;
      padding: 8px 0;
      outline: none;
      overflow-y: auto;
    }
    .input-row textarea::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .send-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        z-index: 100;
        transition: left 0.3s;
      }
      .sidebar.open { left: 0; }
      .sidebar-toggle { display: flex; }
      .chat-area { padding: 20px 14px; }
      .input-bar { padding: 12px 14px 16px; }
      .welcome-prompts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="newChatBtn" title="Start a new conversation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>

    <div class="sidebar-section-title">History</div>
    <div class="history-list" id="historyList">
      <!-- History items will be inserted here dynamically -->
    </div>

    <div class="sidebar-footer">
      <div class="status-dot" id="sidebarDot"></div>
      <span class="status-label" id="sidebarStatus">Checking...</span>
    </div>
  </aside>

  <!-- ===== MAIN AREA ===== -->
  <div class="main-area">

    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <div class="brand-logo">
          <div class="logo-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <span class="brand-name">Carbon <span>Tatva</span></span>
        </div>
        <span class="copilot-badge">Copilot</span>
      </div>
      <div class="topbar-right">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea"></div>

    <!-- Input Bar -->
    <div class="input-bar">
      <div class="input-row">
        <textarea id="queryInput" placeholder="Message CarbonTatva..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>

  </div>

  <script>
    // === CONFIGURE MARKED ===
    marked.setOptions({
      breaks: true,
      gfm: true,
    });

    // === ELEMENTS ===
    const chatArea = document.getElementById("chatArea");
    const queryInput = document.getElementById("queryInput");
    const sendBtn = document.getElementById("sendBtn");
    const themeToggle = document.getElementById("themeToggle");
    const sidebarToggle = document.getElementById("sidebarToggle");
    const sidebar = document.getElementById("sidebar");
    const sidebarDot = document.getElementById("sidebarDot");
    const sidebarStatus = document.getElementById("sidebarStatus");
    const historyList = document.getElementById("historyList");
    const newChatBtn = document.getElementById("newChatBtn");

    // === SUGGESTED PROMPTS ===
    const SUGGESTED_PROMPTS = [
      { icon: "⚡", text: "How do I reduce my pumping costs?" },
      { icon: "🔌", text: "What are the energy conservation opportunities for electric motors?" },
      { icon: "🔥", text: "Explain the types of boilers used in thermal utilities" },
      { icon: "🎛️", text: "What is a Variable Speed Drive (VSD)?" },
    ];

    // === TEXTAREA AUTO-RESIZE ===
    queryInput.addEventListener("input", () => {
      queryInput.style.height = "auto";
      queryInput.style.height = Math.min(queryInput.scrollHeight, 160) + "px";
    });

    // === CHAT SESSIONS ===
    let sessions = JSON.parse(localStorage.getItem("ct_sessions") || "[]");
    let currentSessionId = null;

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    function saveSessions() {
      localStorage.setItem("ct_sessions", JSON.stringify(sessions));
    }

    function getSession(id) {
      return sessions.find(s => s.id === id);
    }

    function startNewChat() {
      const session = { id: generateId(), title: "New Chat", messages: [] };
      sessions.unshift(session);
      currentSessionId = session.id;
      saveSessions();
      renderHistory();
      renderChat();
    }

    function renderHistory() {
      historyList.innerHTML = "";
      sessions.forEach(s => {
        const item = document.createElement("div");
        item.className = "history-item" + (s.id === currentSessionId ? " active" : "");
        item.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span style="overflow:hidden;text-overflow:ellipsis;">${s.title}</span>
        `;
        item.addEventListener("click", () => {
          currentSessionId = s.id;
          renderHistory();
          renderChat();
          if (window.innerWidth <= 768) sidebar.classList.remove("open");
        });
        historyList.appendChild(item);
      });
    }

    function renderChat() {
      chatArea.innerHTML = "";
      const session = getSession(currentSessionId);
      if (!session) return;

      // If no messages yet, show the welcome screen
      if (session.messages.length === 0) {
        showWelcomeScreen();
        return;
      }

      // Show conversation messages
      session.messages.forEach(m => {
        if (m.role === "user") addUserMsgToDOM(m.text);
        else addBotMsgToDOM(m.text, m.citations || []);
      });

      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // === WELCOME SCREEN ===
    function showWelcomeScreen() {
      const welcome = document.createElement("div");
      welcome.className = "welcome-screen";
      welcome.id = "welcomeScreen";

      let promptCards = SUGGESTED_PROMPTS.map(p => `
        <div class="prompt-card" data-prompt="${escapeAttr(p.text)}">
          <div class="prompt-icon">${p.icon}</div>
          <div class="prompt-text">${p.text}</div>
        </div>
      `).join("");

      welcome.innerHTML = `
        <div class="welcome-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="welcome-title">Carbon <span>Tatva</span> Copilot</div>
        <div class="welcome-subtitle">Ask me anything about the BEE Guide Books on Electrical Utilities and Thermal Utilities. I'll provide grounded answers with source citations.</div>
        <div class="welcome-prompts">
          ${promptCards}
        </div>
      `;

      chatArea.appendChild(welcome);

      // Bind prompt card clicks
      welcome.querySelectorAll(".prompt-card").forEach(card => {
        card.addEventListener("click", () => {
          const prompt = card.getAttribute("data-prompt");
          queryInput.value = prompt;
          sendMessage();
        });
      });
    }

    // === DOM HELPERS ===
    function addUserMsgToDOM(text) {
      // Remove welcome screen if it exists
      const ws = document.getElementById("welcomeScreen");
      if (ws) ws.remove();

      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `
        <div class="msg-avatar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="msg-content">
          <div class="msg-bubble">${escapeHtml(text)}</div>
        </div>
      `;
      chatArea.appendChild(row);
    }

    function renderMarkdown(text) {
      // Parse markdown
      let html = marked.parse(text);

      // Style inline citations like (ELECTRICAL-C6-S5) or (THERMAL-C3-S2)
      html = html.replace(
        /\(([A-Z][\w]*-C\d+-S\d+)\)/g,
        '<span class="inline-citation">$1</span>'
      );

      return html;
    }

    function addBotMsgToDOM(text, citations) {
      // Remove welcome screen if it exists
      const ws = document.getElementById("welcomeScreen");
      if (ws) ws.remove();

      const row = document.createElement("div");
      row.className = "msg-row bot";

      let citationsHTML = "";
      if (citations && citations.length > 0) {
        const tags = citations.map(c => {
          const tooltipText = `${escapeHtml(c.book_title)} | pp. ${c.page_start}–${c.page_end}`;
          return `<span class="citation-tag"><span class="ct-tooltip">${tooltipText}</span>${escapeHtml(c.citation_id)}</span>`;
        }).join("");
        citationsHTML = `
          <div class="citations-box">
            <span class="cite-label">Sources</span>
            ${tags}
          </div>
        `;
      }

      const renderedText = renderMarkdown(text);

      row.innerHTML = `
        <div class="msg-avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="msg-content">
          <div class="retrieval-tag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Retrieval Execution Pipeline
          </div>
          <div class="msg-bubble">${renderedText}${citationsHTML}</div>
        </div>
      `;
      chatArea.appendChild(row);
    }

    function addTypingIndicator() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.id = "typingRow";
      row.innerHTML = `
        <div class="msg-avatar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="msg-content">
          <div class="retrieval-tag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Retrieval Execution Pipeline
          </div>
          <div class="typing-indicator">
            <span class="typing-label">Thinking</span>
            <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
          </div>
        </div>
      `;
      chatArea.appendChild(row);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTypingIndicator() {
      const el = document.getElementById("typingRow");
      if (el) el.remove();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // === SEND MESSAGE ===
    async function sendMessage() {
      const text = queryInput.value.trim();
      if (!text) return;

      queryInput.value = "";
      queryInput.style.height = "auto";
      const session = getSession(currentSessionId);
      if (!session) return;

      // Update title from first message
      if (session.messages.length === 0) {
        session.title = text.length > 30 ? text.substring(0, 30) + "..." : text;
        saveSessions();
        renderHistory();
      }

      session.messages.push({ role: "user", text });
      saveSessions();
      addUserMsgToDOM(text);
      addTypingIndicator();
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        // Build conversation history from previous messages (before this new user message)
        const history = session.messages.slice(0, -1).slice(-6).map(m => ({
          role: m.role === "bot" ? "assistant" : m.role,
          content: m.text
        }));

        const resp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, history: history })
        });
        const data = await resp.json();
        removeTypingIndicator();

        if (!resp.ok) {
          const errText = "System Error: " + (data.detail || JSON.stringify(data));
          session.messages.push({ role: "bot", text: errText, citations: [] });
          saveSessions();
          addBotMsgToDOM(errText, []);
        } else {
          session.messages.push({ role: "bot", text: data.answer, citations: data.citations || [] });
          saveSessions();
          addBotMsgToDOM(data.answer, data.citations || []);
        }
      } catch (err) {
        removeTypingIndicator();
        const errText = "Network Error: " + err;
        session.messages.push({ role: "bot", text: errText, citations: [] });
        saveSessions();
        addBotMsgToDOM(errText, []);
      }
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // === EVENT LISTENERS ===
    sendBtn.addEventListener("click", sendMessage);
    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    newChatBtn.addEventListener("click", startNewChat);

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("ct_theme", next);
    });

    sidebarToggle.addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    // === HEALTH CHECK ===
    async function checkHealth() {
      try {
        const resp = await fetch("/health");
        const data = await resp.json();
        if (data.ready) {
          sidebarDot.className = "status-dot ready";
          sidebarStatus.textContent = "Engine Ready";
        } else {
          sidebarDot.className = "status-dot";
          sidebarStatus.textContent = "Not Ready";
        }
      } catch {
        sidebarDot.className = "status-dot";
        sidebarStatus.textContent = "Offline";
      }
    }

    // === INIT ===
    (function init() {
      const savedTheme = localStorage.getItem("ct_theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);

      if (sessions.length === 0) {
        startNewChat();
      } else {
        currentSessionId = sessions[0].id;
        renderHistory();
        renderChat();
      }

      checkHealth();
      setInterval(checkHealth, 15000);
    })();
  </script>
</body>
</html>
